version: 2
updates:
  # The Swift app has no SPM dependencies yet (ViewInspector is pulled in via xcodegen's
  # project.yml, not a checked-in Package.swift). Add a "swift" entry here once one shows up.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "UTC"
  - package-ecosystem: "nuget"
    directory: "/api"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "UTC"
    # .NET ships EF Core, ASP.NET Core and Microsoft.Extensions together, and they require each
    # other's version: EF Core Design 10.0.13 alone fails restore with NU1605 while EF Core is
    # still 10.0.12 (#187). One PR per release builds; Npgsql's EF provider follows EF Core.
    groups:
      dotnet:
        patterns:
          - "Microsoft.*"
          - "Npgsql.*"
    # Major .NET versions (e.g. 10 -> 11) need the TFM, CI SDK and Docker images moved too, so
    # they're done by hand in one PR rather than package by package (#255 bumped one package
    # to 11.0.0 while the runtime stayed on 10).
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.*"
        update-types: ["version-update:semver-major"]
