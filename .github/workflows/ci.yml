name: CI

# Action pinning policy (issue #54) — the split is deliberate, keep it when adding steps:
# - First-party actions/* float on major tags (actions/checkout@v7). They come from GitHub,
#   which we already trust to run the workflow at all, and SonarCloud's S7637 rule exempts them.
# - Third-party actions are pinned to a full commit SHA with the tag as a trailing comment
#   (owner/action@<40-char sha> # vN). SonarCloud's own analysis of this file enforces that
#   (githubactions:S7637) and fails the security-rating gate on a bare tag.
# Dependabot bumps both forms: for a SHA pin it matches the SHA to its release tag and rewrites
# the SHA and the "# vN" comment together — keep that comment so the pin stays readable.

on:
  # PRs into release/* run CI too: the release-restrictions ruleset requires the build check,
  # and without this trigger nothing would produce it on those PRs.
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main]

# The GITHUB_TOKEN only needs to read the repo: the jobs check out, build and pass artifacts
# within the run, and paths-filter lists a PR's files, which a public repo allows with this
# scope. Sonar uses its own token. A job that needs more gets its own permissions block.
permissions:
  contents: read

env:
  # PLAN.md's coverage target (issue #135). A build fails below it: each Apple platform's line
  # coverage of app/Sources, and the API's of api/src, minus .github/coverage-exclusions.txt.
  # Each side is checked when its build runs, so a PR that only changes app/ doesn't check the
  # API, and the other way round. When the gate fails, add tests, or exclude a file no test can
  # reasonably reach (with its reason in that file). Don't lower this number.
  COVERAGE_MIN: 90

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.coverage-gate == 'true' }}
      api: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.workflow == 'true' || steps.filter.outputs.coverage-gate == 'true' }}
      # Whether a PR runs the UI tests (pushes to main always do): see the ui-* filters.
      ui: ${{ steps.filter.outputs.ui-sources == 'true' || steps.filter.outputs.ui-entry == 'true' || steps.filter.outputs.ui-tests == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # "every": a file counts only if it matches all of a filter's patterns, so the "!"
          # patterns exclude documentation. A PR that only touches docs (design notes,
          # runbooks, READMEs) skips the builds; the required "build" check still passes.
          predicate-quantifier: every
          filters: |
            app:
              - 'app/**'
              - '!app/docs/**'
              - '!**/*.md'
            api:
              - 'api/**'
              - '!api/docs/**'
              - '!**/*.md'
            workflow:
              - '.github/workflows/ci.yml'
            # A separate filter: "every" would require one file to match both paths.
            coverage-gate:
              - '.github/{scripts/check-coverage.py,coverage-exclusions.txt}'
            # What the UI tests exercise: the screens and their strings, assets and fonts, the
            # app's entry point and its -UITestScenario setup, the project, and the tests
            # themselves. A PR that changes none of these (domain or data logic, unit tests,
            # CI scripts) skips the UI tests, which take 3-5 of the iOS job's minutes; unit
            # tests still cover the app above COVERAGE_MIN without them (91% on 2026-10-09,
            # against 94% with them). Every push to main runs them, so a UI break from a change
            # outside these paths shows up there.
            ui-sources:
              - 'app/Sources/RecipeRaccoon/{Presentation,Resources,Data/DevSupport}/**'
            ui-entry:
              - 'app/{Sources/RecipeRaccoon/RecipeRaccoonApp.swift,project.yml}'
            ui-tests:
              - 'app/Tests/RecipeRaccoonUITests/**'

  build-apple:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: build (${{ matrix.platform }})
    # Xcode 27, matching Xcode Cloud and local builds. The default macos-26 image only has
    # Xcode 26, whose SDK lacks Xcode 27 APIs (issue #119). xcode-27 is a GitHub preview
    # image: move to its GA label once there is one.
    runs-on: xcode-27
    # iOS and macOS build and test on separate runners at the same time. The iOS simulator
    # leg is the long one; the platform-independent checks run in the macOS leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: RecipeRaccoon-iOS
            release-destination: generic/platform=iOS Simulator
            test-destination: platform=iOS Simulator,name=iPhone 17
            coverage: coverage-ios
            runs-checks: false
          - platform: macOS
            scheme: RecipeRaccoon-macOS
            release-destination: generic/platform=macOS
            test-destination: platform=macOS
            coverage: coverage-macos
            runs-checks: true
    env:
      SCHEME: ${{ matrix.scheme }}
      RELEASE_DESTINATION: ${{ matrix.release-destination }}
      TEST_DESTINATION: ${{ matrix.test-destination }}
      COVERAGE: ${{ matrix.coverage }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify the committed Package.resolved
        if: matrix.runs-checks
        # Xcode Cloud builds from ci_scripts/Package.resolved (see ci_post_clone.sh), a
        # hand-synced copy of project.yml's packages. Resolve fresh for both schemes and
        # fail on any difference, so a stale copy breaks here instead of in Xcode Cloud.
        run: |
          for scheme in RecipeRaccoon-iOS RecipeRaccoon-macOS; do
            xcodebuild -resolvePackageDependencies -project RecipeRaccoon.xcodeproj -scheme "$scheme"
          done
          diff ci_scripts/Package.resolved \
            RecipeRaccoon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Verify formatting
        if: matrix.runs-checks
        # Enforces the style contract in app/.swiftformat; fails without changing anything.
        # Pinned to the version the config was validated against — a newer SwiftFormat
        # can change rule defaults and re-flag code the contract already covers. (The
        # Homebrew formula is unpinned, so install from the GitHub release instead.)
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip -o swiftformat.zip
          unzip -o swiftformat.zip
          ./swiftformat Sources Tests --lint
      - name: Verify lint
        if: matrix.runs-checks
        # Enforces the SwiftLint policy in app/.swiftlint.yml; --strict makes
        # warnings fail, so the config file is the complete policy.
        # Pinned to the version the config was validated against (the Homebrew
        # formula is unpinned, so install from the GitHub release instead).
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o swiftlint.zip
          unzip -o swiftlint.zip
          ./swiftlint Sources Tests --strict
      - name: Build Release
        # The test step only builds Debug, which hides code that exists only under
        # #if DEBUG (issue #95). Build Release too so archives can't break unnoticed.
        # Runs before the tests so a Release-only break fails in minutes, not after them.
        run: |
          xcodebuild -project RecipeRaccoon.xcodeproj -scheme "$SCHEME" \
            -configuration Release -destination "$RELEASE_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build & test
        # -collect-test-diagnostics never: on the xcode-27 image, xcodebuild otherwise spends
        # 10 minutes after the iOS tests trying to collect simulator diagnostics, until it
        # times out ("Failure collecting diagnostics from simulator: Timed out after 600.0
        # seconds"), on every run, passing or not. Failures still come with full logs.
        env:
          RUNS_UI_TESTS: ${{ github.event_name == 'push' || needs.changes.outputs.ui == 'true' }}
        run: |
          skip=()
          if [ "$RUNS_UI_TESTS" != true ]; then
            skip=(-skip-testing:"${SCHEME}UITests")
            echo "::notice::UI tests skipped: this PR changes nothing they exercise (see the ui-* filters)"
          fi
          xcodebuild -project RecipeRaccoon.xcodeproj -scheme "$SCHEME" \
            -destination "$TEST_DESTINATION" \
            -enableCodeCoverage YES -resultBundlePath "$COVERAGE.xcresult" \
            -collect-test-diagnostics never \
            "${skip[@]}" clean test
      - name: Convert coverage to SonarCloud's generic format
        # xccov writes absolute paths on this macOS runner, which the Ubuntu sonarcloud job
        # can't match to its checkout, so make them relative to the repository root. Fails if
        # no path came out relative: SonarCloud would otherwise drop the coverage silently.
        run: |
          Scripts/xccov-to-sonarqube-generic.sh "$COVERAGE.xcresult" |
            sed "s#path=\"$GITHUB_WORKSPACE/#path=\"#" > "$COVERAGE.xml"
          grep -q 'path="app/Sources/' "$COVERAGE.xml" ||
            { echo "::error::No repo-relative app/Sources paths in $COVERAGE.xml"; exit 1; }
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: swift-${{ matrix.coverage }}
          path: app/${{ matrix.coverage }}.xml
          retention-days: 1
      - name: Check coverage
        # After the upload, so a failing report can still be downloaded and read. From the
        # repository root, which the script makes the report paths relative to.
        working-directory: .
        run: |
          python3 .github/scripts/check-coverage.py --source app/Sources --min "$COVERAGE_MIN" \
            "app/$COVERAGE.xml"

  build:
    # The required status check (main's ruleset requires "build"). Passes when both
    # platform legs and the API build passed, or were skipped because nothing under their
    # folder changed.
    needs: [changes, build-apple, build-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the iOS, macOS and API builds
        env:
          CHANGES: ${{ needs.changes.result }}
          APPLE: ${{ needs.build-apple.result }}
          API: ${{ needs.build-api.result }}
        run: |
          echo "changes: $CHANGES, build-apple: $APPLE, build-api: $API"
          [ "$CHANGES" = success ] &&
            { [ "$APPLE" = success ] || [ "$APPLE" = skipped ]; } &&
            { [ "$API" = success ] || [ "$API" = skipped ]; }

  build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Verify formatting
        # Enforces the style contract in api/.editorconfig; fails without changing anything.
        run: dotnet format --verify-no-changes
      - name: Test
        # Testcontainers.PostgreSql needs a Docker-compatible daemon — ubuntu-latest runners
        # have Docker preinstalled, so this works unmodified (local dev here uses Podman
        # instead; see docs/plans for why).
        run: |
          dotnet test --no-build --configuration Release \
            --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Check coverage
        # From the repository root, which the script makes the report paths relative to.
        working-directory: .
        run: |
          python3 .github/scripts/check-coverage.py --source api/src --min "$COVERAGE_MIN" \
            api/coverage/*/coverage.cobertura.xml

  sonarcloud:
    needs: [changes, build-apple, build, build-api]
    # One combined SonarCloud project for both Swift (app/) and .NET (api/) — not two
    # separate projects. Runs whenever either side changed (or neither build job failed
    # outright — a job that didn't need to run reports "skipped", which is fine here; only
    # an actual "failure" should block this). Dependabot PRs get no repo secrets, so
    # SONAR_TOKEN is unavailable — skipped for those, matching the build jobs' own behavior.
    # Pushes to main additionally need the Apple build: there the quality gate grades every
    # line since the previous-version baseline, including Swift code from earlier merges,
    # and Swift coverage only exists when build-apple ran. Without it an api-only merge
    # (e.g. a dependabot bump, whose own PR skips this job) failed the gate on new_coverage
    # for lines it didn't touch (50f4aa4, e8f79c6). PRs don't need this: their new-code
    # window is the diff itself, so an api-only PR scans fairly on C# coverage alone.
    if: |
      always() &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.api == 'true') &&
      needs.build.result != 'failure' && needs.build-api.result != 'failure' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'push' || needs.build-apple.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Download Swift coverage reports
        # "build" also succeeds when the platform builds were skipped, so ask for those.
        if: needs.build-apple.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: swift-coverage-*
          merge-multiple: true
          path: app
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # sonar.coverageReportPaths is only included when the Swift coverage files actually
          # exist — build is skipped entirely on api-only PRs (nothing under app/** changed),
          # so app/coverage-*.xml never gets downloaded then. Pointing the scanner at a
          # nonexistent file isn't a graceful no-op: it's a hard parse error that aborts the
          # whole analysis (confirmed the hard way on an api-only PR).
          SWIFT_COVERAGE_ARG=""
          # The same exclusions as the CI coverage gate, as Sonar's comma-separated list. Trims
          # each line and skips blank and # lines, like the script's load_exclusions().
          COVERAGE_EXCLUSIONS=$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' .github/coverage-exclusions.txt |
            grep -v -e '^#' -e '^$' | paste -sd, -)
          if [ -f app/coverage-ios.xml ] && [ -f app/coverage-macos.xml ]; then
            SWIFT_COVERAGE_ARG='/d:sonar.coverageReportPaths=app/coverage-ios.xml,app/coverage-macos.xml'
          fi
          # Ignored issues, kept here rather than accepted in SonarCloud so the reasons are reviewed (#141):
          #   e1      swift:S1075  the URL field's placeholder text, not a URI the app requests.
          #   e2      swift:S1075  the https scheme is fixed on purpose; the host comes from
          #                        DensityAPI.xcconfig.
          #   e3      swift:S107   RecipeModel.init maps one-to-one to the SwiftData model's stored
          #                        properties, and most parameters have defaults.
          #   e4      swift:S1075  the About page's GitHub links are fixed on purpose: kept in code,
          #                        not the strings catalog, so a translation can't break them.
          $HOME/.dotnet/tools/dotnet-sonarscanner begin \
            /k:"neonpixel-software_recipe-raccoon" \
            /o:"neonpixel-software" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.sources="app/Sources,api/src" \
            /d:sonar.tests="app/Tests,api/tests" \
            $SWIFT_COVERAGE_ARG \
            /d:sonar.cs.opencover.reportsPaths="api/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="api/**/*.trx" \
            /d:sonar.coverage.exclusions="$COVERAGE_EXCLUSIONS" \
            /d:sonar.issue.ignore.multicriteria="e1,e2,e3,e4" \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey="swift:S1075" \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="app/Sources/RecipeRaccoon/Presentation/RecipeCapture/RecipeURLCaptureView.swift" \
            /d:sonar.issue.ignore.multicriteria.e2.ruleKey="swift:S1075" \
            /d:sonar.issue.ignore.multicriteria.e2.resourceKey="app/Sources/RecipeRaccoon/Data/Density/DensityAPIConfiguration.swift" \
            /d:sonar.issue.ignore.multicriteria.e3.ruleKey="swift:S107" \
            /d:sonar.issue.ignore.multicriteria.e3.resourceKey="app/Sources/RecipeRaccoon/Data/Models/RecipeModel.swift" \
            /d:sonar.issue.ignore.multicriteria.e4.ruleKey="swift:S1075" \
            /d:sonar.issue.ignore.multicriteria.e4.resourceKey="app/Sources/RecipeRaccoon/Presentation/About/AboutInfo.swift"
      - name: Build .NET API (captures C# semantic data for the scanner)
        run: dotnet build api/RecipeRaccoon.DensityApi.slnx --configuration Release
      - name: Add the Swift sources to the analysis
        # The Scanner for .NET only analyzes Swift files an MSBuild project includes (#138).
        run: dotnet build app/Sonar/RecipeRaccoon.App.Sonar.csproj --configuration Release
      - name: Test .NET API with coverage
        run: |
          dotnet test api/RecipeRaccoon.DensityApi.slnx --configuration Release --logger trx \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: $HOME/.dotnet/tools/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
