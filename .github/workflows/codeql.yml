name: CodeQL

# CodeQL's advanced setup, replacing the repository's default setup so Swift can be scanned too.
# Default setup can't build the app: the Xcode project is generated by XcodeGen (it isn't in the
# repository), and its macos-latest runner lacks the Xcode 27 SDK the app needs. GitHub rejects
# results from this workflow while default setup is on, so turn that off (Settings → Code
# security → CodeQL analysis) when this workflow is merged.
#
# Action pinning follows ci.yml: actions/* on major tags, everything else on a commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, like default setup, so new queries reach code that hasn't changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: csharp
            build-mode: none
            runner: ubuntu-latest
          # The app needs Xcode 27, like ci.yml's build-apple job (issue #119).
          - language: swift
            build-mode: manual
            runner: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Generate the Xcode project
        if: matrix.language == 'swift'
        working-directory: app
        # Before init: CodeQL's tracer runs what follows it as x86_64, so Homebrew refuses to
        # install ("Cannot install under Rosetta 2 in ARM default prefix") and Swift package
        # manifests fail to run ("Bad CPU type in executable") on an image without Rosetta.
        # So install Rosetta, and resolve the packages here, untraced.
        run: |
          softwareupdate --install-rosetta --agree-to-license
          brew install xcodegen
          xcodegen generate
          for scheme in RecipeRaccoon-iOS RecipeRaccoon-macOS; do
            xcodebuild -resolvePackageDependencies -project RecipeRaccoon.xcodeproj -scheme "$scheme"
          done
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the app
        if: matrix.language == 'swift'
        working-directory: app
        # Both platforms, so code under #if os(iOS) and #if os(macOS) is analyzed. Debug, which
        # also compiles the #if DEBUG scenarios and previews; ci.yml builds Release separately.
        run: |
          for destination in "generic/platform=iOS Simulator" "generic/platform=macOS"; do
            scheme=RecipeRaccoon-iOS
            [[ "$destination" == *macOS ]] && scheme=RecipeRaccoon-macOS
            # Packages come from the untraced resolve above: resolving them again under the
            # tracer runs /usr/bin/sandbox-exec as x86_64, which fails even with Rosetta.
            xcodebuild -project RecipeRaccoon.xcodeproj -scheme "$scheme" \
              -configuration Debug -destination "$destination" \
              -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
              CODE_SIGNING_ALLOWED=NO build
          done
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
          # TEMPORARY: off while default setup is still on, which rejects this workflow's
          # uploads. Remove once default setup is turned off.
          upload: never
