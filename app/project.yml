name: RecipeRaccoon
options:
  bundleIdPrefix: com.neonpixel.reciperaccoon
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Recipe Raccoon
    SWIFT_VERSION: "6.0"
    # The release version; a release tag must be v<MARKETING_VERSION> (app/docs/release.md).
    # Xcode Cloud replaces the build number with its own, so CURRENT_PROJECT_VERSION stays 1.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The app only uses HTTPS (exempt encryption), so uploads skip the export-compliance question.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    CFBundleLocalizations: [en, es, fr, de, nl]
    CFBundleDevelopmentRegion: en

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    exactVersion: 0.10.5

targets:
  RecipeRaccoon-iOS:
    type: application
    platform: iOS
    # Xcode Cloud names its product after this, which otherwise is the target name,
    # RecipeRaccoon-iOS. Same pairing with PRODUCT_NAME as the macOS target below.
    productName: RecipeRaccoon
    sources:
      - Sources/RecipeRaccoon
    configFiles:
      Debug: Config/RecipeRaccoon.xcconfig
      Release: Config/RecipeRaccoon.xcconfig
    settings:
      PRODUCT_MODULE_NAME: RecipeRaccoon
      PRODUCT_NAME: RecipeRaccoon
      PRODUCT_BUNDLE_IDENTIFIER: com.neonpixel.reciperaccoon
      # Merged with the generated Info.plist: UIBackgroundModes has no INFOPLIST_KEY_ setting.
      # CloudKit sync wakes the app with silent pushes (remote-notification).
      INFOPLIST_FILE: Config/Info-iOS.plist
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      # iPad must support all four orientations, or App Store validation rejects a
      # multitasking-capable iPad app (ITMS-90474, issue #103).
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
        UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - RecipeRaccoon-iOSTests
        - RecipeRaccoon-iOSUITests
      gatherCoverageData: true

  RecipeRaccoon-iOSTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/UnitTests.xcconfig
      Release: Config/UnitTests.xcconfig
    sources:
      - Tests/RecipeRaccoonTests
    dependencies:
      - target: RecipeRaccoon-iOS
      - package: ViewInspector

  # Layout checks that need a running app, such as where the header lands (#98).
  # They start the Debug app with -UITestScenario (Data/DevSupport/UITestScenario.swift).
  RecipeRaccoon-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/RecipeRaccoonUITests
    dependencies:
      - target: RecipeRaccoon-iOS

  RecipeRaccoon-macOS:
    type: application
    platform: macOS
    # The app menu (About, Hide, Quit) and the .app in Applications use the product name,
    # which otherwise is the target name, RecipeRaccoon-macOS. Xcode builds with PRODUCT_NAME
    # below; XcodeGen derives the unit tests' TEST_HOST (and so BUNDLE_LOADER) from this key.
    # Keep the two the same.
    productName: Recipe Raccoon
    sources:
      - Sources/RecipeRaccoon
    configFiles:
      Debug: Config/RecipeRaccoon.xcconfig
      Release: Config/RecipeRaccoon.xcconfig
    settings:
      PRODUCT_MODULE_NAME: RecipeRaccoon
      PRODUCT_NAME: Recipe Raccoon
      PRODUCT_BUNDLE_IDENTIFIER: com.neonpixel.reciperaccoon
      # Merged with the generated Info.plist: carries the density API settings.
      INFOPLIST_FILE: Config/Info-macOS.plist
      COMBINE_HIDPI_IMAGES: YES
      # Required for a Mac App Store upload.
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
      ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - RecipeRaccoon-macOSTests
        - RecipeRaccoon-macOSUITests
      gatherCoverageData: true

  RecipeRaccoon-macOSTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/UnitTests.xcconfig
      Release: Config/UnitTests.xcconfig
    sources:
      - Tests/RecipeRaccoonTests
    dependencies:
      - target: RecipeRaccoon-macOS
      - package: ViewInspector

  RecipeRaccoon-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/RecipeRaccoonUITests
    dependencies:
      - target: RecipeRaccoon-macOS
